{% extends "base.html" %}

{% block title %}{{ code }} — Bahi-Khata{% endblock %}

{% block content %}
<div class="shell max-w-md! py-20 text-center">
    <p class="amount text-hero text-ink-3/40">{{ code }}</p>
    <h1 class="mt-2 font-display text-2xl font-bold tracking-tight">{{ title }}</h1>
    {% if message %}
    <p class="mx-auto mt-2 max-w-sm text-sm text-ink-3">{{ message }}</p>
    {% endif %}
    <a href="{{ url_for('profile') if session.get('user_id') else url_for('landing') }}"
       class="btn btn-primary mt-7">
        {{ 'Back to your dashboard' if session.get('user_id') else 'Back to home' }}
    </a>
</div>
{% endblock %}
